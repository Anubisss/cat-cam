# How Grinbert's trills follow your voice (see Style in catcam/voice.py).
# Cheerful and chatty: trills along with you, often.
pitch_follow = 0.4  # trill semitones per semitone you go above or below your usual pitch
jitter = 0.3  # semitones of random pitch per trill (it goes up or down 2 at most in all)
gap = 0.6  # s it stays quiet after a trill before the next can start (up to 1.5 times that)
