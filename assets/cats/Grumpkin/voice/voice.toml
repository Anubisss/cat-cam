# How Grumpkin's grumbles follow your voice (see Style in catcam/voice.py).
# Grumbly: a low "mrrr" every so often, only half listening to your tone.
pitch_follow = 0.15  # grumble semitones per semitone you go above or below your usual pitch
jitter = 0.2  # semitones of random pitch per grumble (it goes up or down 2 at most in all)
gap = 1.3  # s it stays quiet after a grumble before the next can start (up to 1.5 times that)
