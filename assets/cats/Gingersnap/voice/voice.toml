# How Gingersnap's mrrps follow your voice (see Style in catcam/voice.py).
# Snappy: quick "mrrp?"s that keep interrupting you.
pitch_follow = 0.4  # mrrp semitones per semitone you go above or below your usual pitch
jitter = 0.35  # semitones of random pitch per mrrp (it goes up or down 2 at most in all)
gap = 0.5  # s it stays quiet after a mrrp before the next can start (up to 1.5 times that)
