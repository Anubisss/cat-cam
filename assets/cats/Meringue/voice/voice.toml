# How Meringue's meows follow your voice (see Style in catcam/voice.py).
# Posh and bored: a long meow once in a while, whatever your tone.
pitch_follow = 0.1  # meow semitones per semitone you go above or below your usual pitch
jitter = 0.1  # semitones of random pitch per meow (it goes up or down 2 at most in all)
gap = 2.0  # s it stays quiet after a meow before the next can start (up to 1.5 times that)
