# How Pleadwell's mews follow your voice (see Style in catcam/voice.py).
# Pleading: a soft kitten mew now and then, a little higher when you go higher.
pitch_follow = 0.3  # mew semitones per semitone you go above or below your usual pitch
jitter = 0.25  # semitones of random pitch per mew (it goes up or down 2 at most in all)
gap = 1.0  # s it stays quiet after a mew before the next can start (up to 1.5 times that)
