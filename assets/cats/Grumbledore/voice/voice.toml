# How Grumbledore's grumbles follow your voice (see Style in catcam/voice.py).
# Old and slow: a deep grumble now and then, whatever your tone.
pitch_follow = 0  # grumble semitones per semitone you go above or below your usual pitch
jitter = 0.15  # semitones of random pitch per grumble (it goes up or down 2 at most in all)
gap = 2.2  # s it stays quiet after a grumble before the next can start (up to 1.5 times that)
