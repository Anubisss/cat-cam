[project]
name = "cat-cam"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=1.2.2",
    "moderngl>=5.13.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pyvirtualcam>=0.15.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
prepare = [
    "rembg[cpu]>=2.0.86",
]
